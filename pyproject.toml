[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sns-auto-publisher"
version = "0.1.0"
description = "Telegramから受け取ったメディアを検証・変換し、承認後または自動でXへ投稿するSNS投稿オーケストレーター"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "Pillow>=10.0,<13.0",
  "openai>=2.0,<3.0",
  "python-telegram-bot>=21.0,<23.0",
  "python-dotenv>=1.0,<2.0",
  "tweepy>=4.15,<5.0",
  "certifi>=2024.0.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
sns-auto-publisher = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
